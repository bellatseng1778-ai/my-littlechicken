<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>我的小心雞｜LINE 專屬群組</title>
<style>
:root{--bg:#fffaf2;--card:#fff;--ink:#24211d;--muted:#6e675e;--accent:#bd382f;--line:#eadfce}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:0 12px 35px rgba(70,50,25,.08)}
.brand{text-align:center;font-size:30px;font-weight:900;letter-spacing:.04em}.sub{text-align:center;color:var(--muted);margin:8px 0 26px;line-height:1.7}
.q{font-size:20px;font-weight:800;margin:0 0 14px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;gap:10px;padding:15px;border:1px solid var(--line);border-radius:14px;cursor:pointer}.choice input{width:20px;height:20px}
button,a.join{width:100%;display:block;border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;margin-top:18px}
button{background:#24211d;color:#fff;cursor:pointer}.msg{min-height:24px;margin-top:12px;text-align:center;font-weight:700}.join{background:#06c755;color:white}.hide{display:none}.note{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="brand">我的小心雞</div>
<div class="sub">LINE 專屬群組<br>為避免廣告帳號與機器人亂入，加入前請完成簡單驗證。</div>

<div id="quiz">
<p class="q">小心雞固定星期幾營業？</p>
<div class="choices">
<label class="choice"><input type="radio" name="day" value="1">星期一</label>
<label class="choice"><input type="radio" name="day" value="2">星期二</label>
<label class="choice"><input type="radio" name="day" value="3">星期三</label>
</div>
<button id="verify">驗證</button>
<div id="msg" class="msg"></div>
</div>

<div id="success" class="hide">
<p class="q" style="text-align:center">驗證完成</p>
<a class="join" id="joinBtn" href="#" rel="nofollow">加入「我的小心雞」LINE 群組</a>
</div>

<div class="note">本頁僅作為群組入口。請勿轉傳驗證後取得的群組邀請連結。</div>
</section></main>

<script>
// 把真正的 LINE 群組網址拆開，不直接以完整字串出現在 HTML 中。
// 注意：這不是高強度安全措施；若邀請網址外流，請在 LINE 更新邀請網址後同步修改此處。
const p1="https://line.me/ti/g/";
const p2="qdYLDaVwCU";

document.getElementById("verify").addEventListener("click",()=>{
  const pick=document.querySelector('input[name="day"]:checked');
  const msg=document.getElementById("msg");
  if(!pick){msg.textContent="請先選一個答案";return;}
  if(pick.value!=="2"){msg.textContent="答案不對，再試一次";return;}
  msg.textContent="";
  document.getElementById("quiz").classList.add("hide");
  const btn=document.getElementById("joinBtn");
  btn.href=p1+p2;
  document.getElementById("success").classList.remove("hide");
});
</script>
</body>
</html>
